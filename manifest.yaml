sampler_headline:
  temperature: 0.8
  top_p: 0.95
  top_k: 50
  repetition_penalty: 1.0
  seed: deterministic per prompt ID, same seed baseline+ablations
  max_new_tokens: 1024 (reference-length-informed cap)
  stop: official chat template only
  locus: generated-token residual stream only (prefill untouched; prefill+generation is appendix)
intervention:
  form_headline: "h' = h - alpha*B*max(B^T(h-muH),0) per generated token"
  form_control: "h' = h - alpha*B*B^T(h-muH)"
  ranks: [2, 4, 8, 16, 32]
  alphas: [0.25, 0.5, 0.75, 1.0]
  rhos: [0.5, 0.75, 1.0]
  cleaning: "implemented native-space B_clean = orth[(I - rho*P*P^T) B_raw], with P from eight native-space protected contrasts"
controls:
  suite: H2-MRSC-400-v5
  epoch_id: H2-MRSC-400-v5-rand-only
  status: frozen-post-TEST-v5
  protocol: CONTROL_PROTOCOL.md
  models: [L1, O1, Q08, Q20, G2]
  new_gpu_arms: [ANCHOR-BASE, ANCHOR-CONE, RAND-RANK-DOSE]
  dropped_arms: [PC1-DOSE]
  reused_arms: [HUMAN, FULL-SYM]
  cpu_arm: LEX-MATCH
  main_split: TEST-JMQ-400
  runtime_strata: {test_jmq: contemporaneous-v2-runtime, val2: archived-original-runtime}
  budget_gpu_hours: {nominal: "58-64", hard_cap: 72}
judge_JMQ:
  provider: opencode-go
  model_id: muse-spark-1.3-contributor
  transport: authenticated OpenCode CLI
  structure: DEFT-compatible blind pairwise, hash-randomized order; overall quality completed, fine-grained dimensions not run
  formula: "score = P(a wins) + 0.5*P(tie); JMQ_H = 2*score(model,human), 1.0 = parity; JMQ_delta = score(H2,baseline)"
  tie_handling: "tie = 0.5 win; failed/unparsed responses are incomplete and rejudged"
  direct_filter: "H2-vs-baseline excludes pairs where both candidates open with a refusal; high-recall prefix audit with two documented substantive-answer overrides; audit parquet retained"
  subsets: {overall: 400 TEST-JMQ, direct_200: true, finegrained_100_each: not_run}
preservation_gates:
  ifeval: ">=95% baseline"
  capability_composite_MMLUPro500_GSM8K500: ">=97% baseline"
  safety_harmful200_refusal: ">=95% baseline"
  benign200_false_refusal_increase_pp: "<=2"
  pathology_increase_pp: "<=2"
  kl_256benign: report
stats:
  bootstrap: 10000 paired, 95 CI
  test: paired permutation
  correction: Holm within metric family across 8 models
  cross_model_claim: median recovery positive, >=6/8 significant/consistent, no systematic gate breach
packages:
  python: 3.12.14
  torch: 2.11.0+cu128
  transformers: 5.16.1
  datasets: 5.0.1
  accelerate: 1.14.0
