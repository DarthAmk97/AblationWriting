  probes: 7000
  preservation: {ifeval: 9100, mmlu: 9200, gsm8k: 9300, safety_harmful: 9400, safety_benign: 9500}
  splits: {shuffle: 0, interp: 1234, stratified_hash: "split-seed-<domain>"}
  judge_order: hash-seeded coin per pair (temperature 0)
  stats_bootstrap: 999
